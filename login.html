<body>

<header>

    <nav>

        </ul>
    </nav>
</header>

<main class="login-main">

    <div class="login-box">
        <div class="login-icon">♡</div>

        <h1>เข้าสู่ระบบ</h1>
        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์เที่ยวบ้านเรา</p>

        <form id="loginForm">

            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username"
                   placeholder="กรอกชื่อผู้ใช้" required>

            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password"
                   placeholder="กรอกรหัสผ่าน" required>

            <button type="submit" class="button">
                เข้าสู่ระบบ
            </button>

        </form>

        <p class="back-home">
            <a href="index.html">กลับสู่หน้าแรก</a>
        </p>
    </div>

</main>

<footer>
    <p>001 กมลชนก เยื้อใย | เที่ยวบ้านเรา</p>
</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    alert("นี่คือระบบเข้าสู่ระบบตัวอย่าง ยังไม่ได้เชื่อมต่อฐานข้อมูลจริง");
});
</script>
